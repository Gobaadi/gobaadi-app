services:
  - type: web
    name: gobadi-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --production=false && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: gobadi-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: gobadi-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: gobadi-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: gobadi-db
          property: password
      - key: DB_DATABASE
        fromDatabase:
          name: gobadi-db
          property: database
      - key: DB_SSL
        value: "true"
      - key: REDIS_HOST
        value: "relaxed-warthog-120597.upstash.io"
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_TLS
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_FROM
        value: "Gobadi App <onboarding@resend.dev>"
      - key: GMAIL_USER
        value: "arpandey.web@gmail.com"
      - key: GMAIL_API_CLIENT_ID
        value: "826032045406-i412v1230an5l6rqjqsbn1hm8iro3t6e.apps.googleusercontent.com"
      - key: GMAIL_API_CLIENT_SECRET
        sync: false
      - key: GMAIL_API_REFRESH_TOKEN
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: ""
      - key: PUSH_ANDROID_CHANNEL_ID
        value: "default"

databases:
  - name: gobadi-db
    plan: free
    databaseName: gobadi
    user: gobadi